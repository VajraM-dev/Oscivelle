[package]
name = "visualiser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pollster = "1"
realfft = "3"
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"] }
toml = "1"
wgpu = "30"
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
