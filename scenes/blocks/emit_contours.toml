kind = "emitter"
description = "Crisp contour lines of a domain-warped noise plasma, brightest on its ridges"
[[param]]
name = "density"      # contour lines per unit of field
min = 4.0
max = 12.0
[[param]]
name = "warp"         # domain-warp strength
min = 1.5
max = 4.0
[[param]]
name = "hue_offset"
min = 0.0
max = 1.0
fixed = true
