kind = "emitter"
description = "Landscape: a raymarched 3D heightfield (dunes, ridged mountains, mesas, craters or ocean swell) under a sun, seen gliding sideways, craning up, panning or from high above"
[[param]]
name = "speed"      # camera travel; multiplies time()
min = 0.6
max = 1.4
fixed = true
[[param]]
name = "scale"      # terrain frequency; the camera path depends on it
min = 0.7
max = 1.3
fixed = true
[[param]]
name = "sun"        # sun elevation
min = 0.15
max = 0.7
