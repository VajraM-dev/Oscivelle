kind = "emitter"
description = "Scan bars: three bright bars sweep down (or across) the frame locked to the beat; the lead bar thickens on kicks, drops flood it"
[[param]]
name = "width"      # bar half-width, 0..1 of the sweep
min = 0.01
max = 0.05
[[param]]
name = "gain"
min = 0.6
max = 1.4
[[param]]
name = "hue_offset"
min = 0.0
max = 1.0
fixed = true
