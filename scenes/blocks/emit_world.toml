kind = "emitter"
description = "Procedural 3D still life: 2-4 smooth-blended primitives (repeated, twisted, on a floor by seed), lit with soft shadows and filmed by an orbit, dolly, crane, drift or handheld camera"
[[param]]
name = "camera_speed" # scales the camera clock, so fixed
min = 0.6
max = 1.6
fixed = true
[[param]]
name = "blend"      # multiplies the seed's smooth-union radius
min = 0.4
max = 1.6
[[param]]
name = "light"
min = 0.7
max = 1.4
